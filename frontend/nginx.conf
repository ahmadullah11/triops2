# ShopLite frontend — the single public entry point.
#
# Browser  ->  localhost:8084  ->  this container :80
# Nginx    ->  http://catalog:3000 | inventory:8081 | order:8082   (Docker DNS)
#
# Upstream names are resolved through Docker's embedded DNS (127.0.0.11) on
# every request (valid=10s), so recreating a backend container with a new IP
# does not leave this proxy pointing at a stale address.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 ipv6=off valid=10s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Docker captures these streams; keep app logs on stdout/stderr.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # ---------- container health ----------
    # Simple liveness probe used by HEALTHCHECK. It does NOT prove the backends
    # are up; it proves this Nginx is serving.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------- API reverse proxy ----------
    # Trailing slash on the public prefix is required. `rewrite ... break` strips
    # /api/<service> and `proxy_pass $url` forwards the rewritten URI:
    #   /api/catalog/products     -> catalog:3000/products
    #   /api/inventory/stock/1    -> inventory:8081/stock/1
    #   /api/orders/orders        -> order:8082/orders
    # (service prefix "orders" + backend route "/orders"; not a typo)

    location /api/catalog/ {
        set $catalog_upstream http://catalog:3000;
        rewrite ^/api/catalog/(.*)$ /$1 break;
        proxy_pass $catalog_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;

        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        # Backend JSON errors (400/404/409) pass through untouched; only gateway
        # failures (502/503/504) are replaced by the JSON handler below.
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    location /api/inventory/ {
        set $inventory_upstream http://inventory:8081;
        rewrite ^/api/inventory/(.*)$ /$1 break;
        proxy_pass $inventory_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    location /api/orders/ {
        set $order_upstream http://order:8082;
        rewrite ^/api/orders/(.*)$ /$1 break;
        proxy_pass $order_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    # Unknown /api/... path: answer as an API, do not fall back to index.html.
    location /api/ {
        default_type application/json;
        return 404 '{"error":"unknown API path"}';
    }

    location @api_unavailable {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"backend service unavailable"}';
    }

    # ---------- static assets ----------
    # Vite emits content-hashed filenames, so they can be cached for a long time.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    # index.html must always be revalidated, otherwise clients keep an old shell
    # that references deleted asset hashes after a deploy.
    location = /index.html {
        expires -1;
    }

    # ---------- SPA fallback ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
