name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default: this pipeline builds images but never pushes them.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Catalog (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: catalog-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: catalog-service/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  frontend:
    name: Frontend (Node + Vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build

  inventory:
    name: Inventory (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: inventory-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: inventory-service/go.mod
          cache-dependency-path: inventory-service/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -v
      - name: Build
        run: go build ./...

  order:
    name: Order (Java + Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: order-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn -B -ntp test

  images:
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [catalog, frontend, inventory, order]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: catalog
            context: ./catalog-service
          - service: inventory
            context: ./inventory-service
          - service: order
            context: ./order-service
          - service: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: shoplite-${{ matrix.service }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
