# ShopLite — host Nginx for https://triops1.duckdns.org
#
# Install to: /etc/nginx/sites-available/shoplite
# Enable with: sudo ln -s /etc/nginx/sites-available/shoplite /etc/nginx/sites-enabled/shoplite
#
# This is the PRE-CERTIFICATE version: HTTP only. Run certbot afterwards and it
# rewrites this file, adding the 443 server block and the HTTP->HTTPS redirect:
#   sudo certbot --nginx -d triops1.duckdns.org
#
# Why a host Nginx at all, when the frontend image already contains Nginx?
# The TLS certificate must be renewed every ~60 days by a process on the host.
# Keeping the certificate (and therefore TLS termination) on the host means a
# frontend image rebuild never touches the certificate.
#
# Traffic: internet:443 -> this Nginx -> 127.0.0.1:8080 (frontend container)
#          The container is never published on a public interface.

server {
    listen 80;
    listen [::]:80;
    server_name triops1.duckdns.org;

    # Certbot's HTTP-01 challenge writes a file here and fetches it over
    # port 80. If this location is missing, certificate issuance fails.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ShopLite posts small JSON bodies; 2m is generous.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Order service calls catalog + inventory before answering, so allow
        # more than the default 60s? No - 30s is plenty here, and a timeout is
        # better than a request that hangs forever.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Return a real JSON error instead of an Nginx HTML page when the
        # frontend container is down, so API clients get parseable output.
        proxy_intercept_errors on;
        error_page 502 503 504 = @frontend_down;
    }

    location @frontend_down {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"frontend unavailable"}';
    }
}
